name: Sanity Rebuild Trigger

on:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Empty commit to trigger Cloudflare build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild triggered by Sanity publish"
          git push
