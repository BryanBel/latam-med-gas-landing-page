name: Sanity Rebuild Trigger

on:
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit rather than the moving `v4` tag: a tag can be re-pointed, and this
      # job holds write access to the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Empty commit to trigger Cloudflare build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: rebuild triggered by Sanity publish"
          git push
